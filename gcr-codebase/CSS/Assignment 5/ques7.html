
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4f4;
            color: #333;

        
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form Container */
        .contact-container {
            width: 90%;
            max-width: 550px;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #176b87;
            margin-bottom: 25px;
        }

        /* Form */
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

  
        label {
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            font-size: 16px;
            color: #333;
        }

    
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #176b87;
            box-shadow: 0 0 5px rgba(23, 107, 135, 0.3);
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #176b87;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0f4c5c;
        }
    </style>
</head>

<body>

    <main class="contact-container">

        <h1>Contact Us</h1>

        <form>

            <div>
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div>
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div>
                <label for="subject">Subject</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                    required
                >
            </div>

            <div>
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message..."
                    required
                ></textarea>
            </div>

            <button type="submit">Send Message</button>

        </form>

    </main>

</body>
</html>
