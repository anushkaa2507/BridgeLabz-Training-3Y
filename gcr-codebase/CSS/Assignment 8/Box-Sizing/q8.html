<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <h1>Box-Sizing Comparison</h1>

    <main class="comparison">

        <section class="box default-box">
            <h2>Default Box</h2>
            <p>
                box-sizing: content-box
            </p>
            <p>
                Width does not include padding and border.
            </p>
        </section>

        <section class="box border-box">
            <h2>Border Box</h2>
            <p>
                box-sizing: border-box
            </p>
            <p>
                Width includes padding and border.
            </p>
        </section>

    </main>

</body>
</html>
