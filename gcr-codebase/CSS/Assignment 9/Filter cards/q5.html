<!DOCTYPE html>

    <title>Filter Cards</title>

<body>

            <article class="profile"> <img class="sepia" src="https://picsum.photos/id/1011/400/300" alt="Team member">

                <p>Developer</p>
            </article>
            <article class="profile"> <img class="contrast" src="https://picsum.photos/id/1027/400/300"
                    alt="Team member">

        </section>
    </main>

</html>
