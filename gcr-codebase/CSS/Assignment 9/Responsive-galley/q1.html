<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-gallery.css">
</head>

<body>
    <header>
        <h1>Image Filter Gallery</h1>
    </header>
    <main>
        <section class="gallery">
            <figure> <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Nature">
                <figcaption>Blur Effect</figcaption>
            </figure>
            <figure> <img class="grayscale" src="https://picsum.photos/id/1016/500/350" alt="Mountain">
                <figcaption>Grayscale Effect</figcaption>
            </figure>
            <figure> <img class="sepia" src="https://picsum.photos/id/1025/500/350" alt="Dog">
                <figcaption>Sepia Effect</figcaption>
            </figure>
            <figure> <img class="brightness" src="https://picsum.photos/id/1035/500/350" alt="Forest">
                <figcaption>Brightness Effect</figcaption>
            </figure>
            <figure> <img class="contrast" src="https://picsum.photos/id/1040/500/350" alt="Beach">
                <figcaption>Contrast Effect</figcaption>
            </figure>
            <figure> <img class="hue" src="https://picsum.photos/id/1069/500/350" alt="Landscape">
                <figcaption>Hue Rotate Effect</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>Responsive Filter Gallery</p>
    </footer>
</body>

</html>
