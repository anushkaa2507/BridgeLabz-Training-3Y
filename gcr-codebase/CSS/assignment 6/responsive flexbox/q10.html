
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <article>
            <h2 class="title">Welcome to My Website</h2>

            <p>
                This is a responsive webpage created using
                CSS Flexbox and Grid.
            </p>

            <div class="boxes">
                <div class="box">HTML</div>
                <div class="box">CSS</div>
                <div class="box">JavaScript</div>
            </div>
        </article>

        <aside>
            <h2>Sidebar</h2>
            <p>Latest Updates</p>
            <p>Popular Posts</p>
            <p>Categories</p>
        </aside>

    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
