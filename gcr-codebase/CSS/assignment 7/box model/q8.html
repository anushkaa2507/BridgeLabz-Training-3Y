
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <h1>CSS Box Model</h1>

    <main class="container">

        <div class="margin-layer">

            <div class="border-layer">

                <div class="padding-layer">

                    <div class="content">
                        <h2>Content</h2>
                        <p>This is the content area.</p>
                    </div>

                </div>

            </div>

        </div>

    </main>

    <section class="description">
        <p><strong>Content:</strong> Actual information inside the box.</p>
        <p><strong>Padding:</strong> Space between content and border.</p>
        <p><strong>Border:</strong> Line surrounding the padding.</p>
        <p><strong>Margin:</strong> Space outside the border.</p>
    </section>

    <h2>Box-sizing: border-box</h2>

    <div class="border-box">
        Width includes content + padding + border.
    </div>

</body>
</html>
