
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <h1>Height and Width Practice</h1>

    <main class="container">

        <div class="box box1">
            <h2>Pixel Box</h2>
            <p>Width: 200px<br>Height: 150px</p>
        </div>

        <div class="box box2">
            <h2>Percentage Box</h2>
            <p>Width: 40%</p>
        </div>

        <div class="box box3">
            <h2>Viewport Box</h2>
            <p>Height: 30vh<br>Width: 15em</p>
        </div>

    </main>

</body>
</html>
