<!DOCTYPE html>
<html>
<head>

    <!-- The title defines the name shown on the browser tab -->
    <title>Important Head Elements</title>

    <!-- The charset specifies the character encoding -->
    <meta charset="UTF-8">

    <!-- The description provides information about the webpage -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements.">

    <!-- The author specifies who created the webpage -->
    <meta
        name="author"
        content="Anushka Agrawal">

    <!-- The base tag defines the base URL for relative links -->
    <base href="https://example.com/">

    <!-- The link tag can connect external resources such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag is used to contain CSS -->
    <style>
    </style>

    <!-- The script tag is used to contain or connect JavaScript -->
    <script>
    </script>

</head>
<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This webpage demonstrates the important elements used inside
        the HTML head section.
    </p>

</body>
</html>
