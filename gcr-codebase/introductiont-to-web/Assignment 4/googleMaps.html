<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h1>My City Location</h1>

    <!-- loading="lazy" loads the map only when it is needed, improving page loading performance -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,Uttar+Pradesh&output=embed"
        title="Google Map of Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
