<!DOCTYPE html>
<html>
<head>
    <title>Selection Page</title>
</head>
<body>

    <h1>Travel Selection</h1>

    <label>Country:</label>
    <select>
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
        <option>Australia</option>
    </select>

    <br><br>

    <label>State:</label>
    <select>
        <option>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Rajasthan</option>
    </select>

    <br><br>

    <label>City:</label>
    <select>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
    </select>

    <br><br>

    <label>Favorite Tourist Place:</label>
    <select>
        <option>Taj Mahal</option>
        <option>India Gate</option>
        <option>Gateway of India</option>
        <option>Hawa Mahal</option>
    </select>

    <br><br>

    <p>
        My selected choices are: India, Uttar Pradesh, Agra,
        and my favorite tourist place is the Taj Mahal.
    </p>

</body>
</html>
