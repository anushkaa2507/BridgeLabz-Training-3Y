<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e6d9d0;
            font-family: Arial, sans-serif;
        }

        form {
            width: 380px;
            padding: 30px;
            background-color: #e6d9d0;
            border-radius: 25px;

            /* Neomorphism */
            box-shadow:
                12px 12px 25px #c4b8b0,
                -12px -12px 25px #fffaf5;
        }

        h2 {
            text-align: center;
            margin: 0 0 25px;
            color: #514740;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #514740;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="file"],
        select {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 12px;
            background-color: #e6d9d0;
            outline: none;

            box-shadow:
                inset 5px 5px 10px #c4b8b0,
                inset -5px -5px 10px #fffaf5;
        }

        input:focus,
        select:focus {
            box-shadow:
                inset 3px 3px 6px #c4b8b0,
                inset -3px -3px 6px #fffaf5;
        }

        .gender {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .gender label {
            display: inline;
            font-weight: normal;
            margin-left: 4px;
        }

        .gender input {
            accent-color: #8c7668;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .checkbox label {
            display: inline;
            margin: 0;
            font-weight: normal;
        }

        .checkbox input {
            accent-color: #8c7668;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background-color: #e6d9d0;
            color: #514740;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            box-shadow:
                6px 6px 12px #c4b8b0,
                -6px -6px 12px #fffaf5;
        }

        button:active {
            box-shadow:
                inset 4px 4px 8px #c4b8b0,
                inset -4px -4px 8px #fffaf5;
        }
    </style>
</head>

<body>

    <form action="/register" method="post">

        <h2>Registration Form</h2>

        <div class="field">
            <label for="FullName">Name</label>
            <input type="text" id="FullName" name="FullName"
                   placeholder="Enter your name">
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email">
        </div>

        <div class="field">
            <label>Gender</label>

            <div class="gender">
                <div>
                    <input type="radio" value="male" id="male" name="gender">
                    <label for="male">Male</label>
                </div>

                <div>
                    <input type="radio" value="female" id="female" name="gender">
                    <label for="female">Female</label>
                </div>
            </div>
        </div>

        <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date">
        </div>

        <div class="field">
            <label for="file">Upload File</label>
            <input type="file" id="file">
        </div>

        <div class="field">
            <label for="branch">Branch</label>

            <select name="branch" id="branch">
                <option value="">Select Branch</option>
                <option value="cse">CSE</option>
                <option value="it">IT</option>
                <option value="ece">ECE</option>
                <option value="me">ME</option>
            </select>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="JavaScript">
            <label for="JavaScript">JavaScript</label>
        </div>

        <button type="submit">Register</button>

    </form>

</body>
</html>
