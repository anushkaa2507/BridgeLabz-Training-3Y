
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

<header class="text-center bg-dark text-white p-4">
    <h1 class="fw-bold">Anushka Agrawal</h1>
    <p>Web Developer | CSE Student</p>
</header>

<main class="container mt-4">
    <section class="text-center p-5 bg-white shadow rounded">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300"
             class="img-fluid rounded-circle profile-img mb-3"
             alt="Profile Image">

        <h2 class="fw-bold">Hello, I'm Anushka!</h2>
        <p class="lead">I love creating beautiful and responsive websites.</p>

        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>
    </section>

    <section class="mt-4 mb-4">
        <h3 class="text-center mb-3">Contact Me</h3>
        <form class="mx-auto contact-form">
            <input type="text" class="form-control mb-3" placeholder="Your Name">
            <input type="email" class="form-control mb-3" placeholder="Your Email">
            <textarea class="form-control mb-3" rows="3" placeholder="Your Message"></textarea>
            <button type="button" class="btn btn-success w-100">Send Message</button>
        </form>
    </section>
</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 My Portfolio
</footer>

</body>
</html>
