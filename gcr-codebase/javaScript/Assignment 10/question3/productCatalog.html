
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>Smart Shopping Store</h1>
    <p>Find the best products at affordable prices</p>
</header>

<main class="container py-5">
    <h2 class="text-center mb-4">Our Products</h2>

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" class="card-img-top" alt="Headphones">
                <div class="card-body text-center">
                    <h5>Headphones</h5>
                    <p>₹1,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" class="card-img-top" alt="Watch">
                <div class="card-body text-center">
                    <h5>Smart Watch</h5>
                    <p>₹2,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://images.unsplash.com/photo-1503602642458-232111445657?w=400" class="card-img-top" alt="Chair">
                <div class="card-body text-center">
                    <h5>Modern Chair</h5>
                    <p>₹3,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" class="card-img-top" alt="Shoes">
                <div class="card-body text-center">
                    <h5>Sports Shoes</h5>
                    <p>₹1,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 Smart Shopping Store
</footer>

</body>
</html>
