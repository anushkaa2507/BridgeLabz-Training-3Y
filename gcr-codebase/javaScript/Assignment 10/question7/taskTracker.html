
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bg-dark text-white p-4">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h3">My Task Tracker</h1>
        <span class="badge bg-danger fs-6">Pending: 4</span>
    </div>
</header>

<main class="container py-5">

    <h2 class="text-center mb-4">My Tasks</h2>

    <ul class="list-group">

        <li class="list-group-item d-flex justify-content-between align-items-center">
            Complete Bootstrap Assignment
            <span class="badge bg-danger">High</span>
        </li>

        <li class="list-group-item d-flex justify-content-between align-items-center">
            Prepare for University Exam
            <span class="badge bg-warning text-dark">Medium</span>
        </li>

        <li class="list-group-item d-flex justify-content-between align-items-center">
            Read a Book
            <span class="badge bg-success">Low</span>
        </li>

        <li class="list-group-item d-flex justify-content-between align-items-center">
            Complete Java Practice
            <span class="badge bg-danger">High</span>
        </li>

    </ul>

    <section class="text-center mt-4">
        <button class="btn btn-success">
            Completed <span class="badge bg-light text-dark">3</span>
        </button>
    </section>

</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 My Task Tracker
</footer>

</body>
</html>
