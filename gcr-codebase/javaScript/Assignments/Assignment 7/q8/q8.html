<!DOCTYPE html>
<html>
<head>
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Custom Dropdown</h2>

    <div class="dropdown">

        <button id="dropdownBtn">Select a Course</button>

        <div id="options" class="options">
            <p>Java</p>
            <p>Python</p>
            <p>JavaScript</p>
            <p>C++</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
